<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Key 测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f0f4f8;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:420px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h2{font-size:18px;margin-bottom:16px;text-align:center}
.row{margin-bottom:12px}
.row label{display:block;font-size:12px;color:#667;margin-bottom:4px;font-weight:600}
.row input,.row select{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;background:#f9fafb}
.row input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.btn:active{opacity:.85}
.btn:disabled{opacity:.5}
.result{margin-top:12px;padding:12px;border-radius:10px;font-size:13px;white-space:pre-wrap;word-break:break-all;display:none}
.result.ok{display:block;background:#f0fdf4;border:1px solid #86efac;color:#166534}
.result.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.result.loading{display:block;background:#eff6ff;border:1px solid #93c5fd;color:#1e40af}
.hint{font-size:11px;color:#94a3b8;margin-top:4px}
.presets{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.preset{padding:4px 10px;border-radius:14px;border:1px solid #d1d5db;background:#f8fafc;font-size:11px;cursor:pointer;color:#5a6b85}
.preset:active{background:#e0e7ff}
</style>
</head>
<body>
<div class="card">
  <h2>🔑 API Key 连通性测试</h2>

  <div class="row">
    <label>Base URL</label>
    <input id="baseUrl" value="https://api.deepseek.com/v1" placeholder="https://api.openai.com/v1">
  </div>

  <div class="row">
    <label>Model</label>
    <input id="model" value="deepseek-chat" placeholder="gpt-4o / deepseek-chat / claude-3-opus">
  </div>

  <div class="row">
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="sk-...">
  </div>

  <div class="presets">
    <span class="preset" onclick="setPreset('https://api.deepseek.com/v1','deepseek-chat')">DeepSeek</span>
    <span class="preset" onclick="setPreset('https://api.openai.com/v1','gpt-4o')">OpenAI</span>
    <span class="preset" onclick="setPreset('https://api.moonshot.cn/v1','moonshot-v1-8k')">Moonshot</span>
    <span class="preset" onclick="setPreset('https://open.bigmodel.cn/api/paas/v4','glm-4-flash')">智谱GLM</span>
  </div>

  <button class="btn" id="testBtn" onclick="test()">🚀 测试连通</button>

  <div class="result" id="result"></div>
</div>

<script>
function setPreset(url, model) {
  document.getElementById('baseUrl').value = url;
  document.getElementById('model').value = model;
}

async function test() {
  var baseUrl = document.getElementById('baseUrl').value.trim();
  var model = document.getElementById('model').value.trim();
  var apiKey = document.getElementById('apiKey').value.trim();
  var btn = document.getElementById('testBtn');
  var result = document.getElementById('result');

  if (!baseUrl || !apiKey) {
    result.className = 'result err';
    result.textContent = '❌ 请填写 Base URL 和 API Key';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ 测试中...';
  result.className = 'result loading';
  result.textContent = '⏳ 正在连接 ' + baseUrl + ' ...\nModel: ' + model;

  var url = baseUrl.replace(/\/+$/, '') + '/chat/completions';

  try {
    var resp = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: model,
        messages: [{role:'user',content:'Hi'}],
        max_tokens: 10
      })
    });

    var data = await resp.json();

    if (resp.ok && data.choices) {
      result.className = 'result ok';
      result.textContent = '✅ 连通成功！\n\n模型: ' + model + '\n回复: ' + data.choices[0].message.content + '\nTokens: ' + JSON.stringify(data.usage || {});
    } else {
      result.className = 'result err';
      result.textContent = '❌ 请求失败 HTTP ' + resp.status + '\n\n' + JSON.stringify(data, null, 2);
    }
  } catch(e) {
    result.className = 'result err';
    result.textContent = '❌ 网络错误\n\n' + e.message + '\n\n可能是 URL 不对或 CORS 被拦截';
  }

  btn.disabled = false;
  btn.textContent = '🚀 测试连通';
}
</script>
</body>
</html>
